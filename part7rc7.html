    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Base style for parsed phrase chips */
        .phrase-tag {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px 1px;
            border-radius: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
            border-bottom: 2px transparent solid;
            line-height: 1.8rem;
        }

        /* Highlight tên người nói & thời gian */
        .speaker-tag {
            font-weight: 700 !important;
            color: #1e293b !important;
            background-color: #e2e8f0 !important;
        }

        .time-tag {
            color: #64748b !important;
            font-size: 0.9em;
            margin-right: 6px;
        }

        /* Pastel Highlight colors on hover or active filter */
        .phrase-vp:hover, .phrase-vp.active-filter {
            background-color: #ffedd5 !important;
            color: #9a3412;
            border-bottom-color: #f97316;
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.15);
        }

        .phrase-np:hover, .phrase-np.active-filter {
            background-color: #dbeafe !important;
            color: #1e40af;
            border-bottom-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.15);
        }

        .phrase-pp:hover, .phrase-pp.active-filter {
            background-color: #dcfce7 !important;
            color: #166534;
            border-bottom-color: #22c55e;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.15);
        }

        .phrase-adjp:hover, .phrase-adjp.active-filter {
            background-color: #fef3c7 !important;
            color: #92400e;
            border-bottom-color: #eab308;
            box-shadow: 0 2px 8px rgba(234, 179, 8, 0.15);
        }

        .phrase-other:hover, .phrase-other.active-filter {
            background-color: #f3e8ff !important;
            color: #6b21a8;
            border-bottom-color: #a855f7;
            box-shadow: 0 2px 8px rgba(168, 85, 247, 0.15);
        }

        /* Hover Tooltip design */
        .phrase-tag .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .phrase-tag:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Note formatting in brackets */
        .bracket-note {
            color: #64748b;
            font-weight: 400;
            font-size: 0.9em;
            margin-left: 2px;
            margin-right: 2px;
        }

        /* Bold emphasis for words immediately preceding brackets */
        .bold-before-bracket {
            font-weight: 700 !important;
            color: #0f172a;
        }
    </style>
</head>

        function renderParsedData(parsedItems) {
            const container = document.getElementById('resultContent');
            container.innerHTML = '';

            document.getElementById('phraseCount').innerText = `${parsedItems.length} cụm từ`;

            parsedItems.forEach((item, index) => {
                // Kiểm tra xem mục tiếp theo có phải là thời gian hay không để biết đây là Tên người nói
                const nextItem = parsedItems[index + 1];
                const isTime = /^\(\d+:\d+\s+[AP]\.M\.\)$/i.test(item.text.trim());
                const isNextTime = nextItem && /^\(\d+:\d+\s+[AP]\.M\.\)$/i.test(nextItem.text.trim());

                // Xuống dòng và chèn khoảng cách trước tên người nói (ngoại trừ tên đầu tiên)
                if (isNextTime) {
                    const lineBreak = document.createElement('div');
                    lineBreak.className = index === 0 ? 'w-full mb-1' : 'w-full mt-5 mb-1 border-t border-slate-100 pt-3';
                    container.appendChild(lineBreak);
                }

                const tag = document.createElement('span');
                
                // Style phân biệt riêng cho Tên người nói và Thời gian
                if (isNextTime) {
                    tag.className = `phrase-tag speaker-tag`;
                } else if (isTime) {
                    tag.className = `phrase-tag time-tag`;
                } else {
                    tag.className = `phrase-tag phrase-${item.type}`;
                }

                tag.setAttribute('data-type', item.type);
                tag.setAttribute('data-index', index);

                const formattedContent = formatBracketText(item.text);

                tag.innerHTML = `
                    ${formattedContent}
                    <span class="tooltip bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg shadow-xl font-normal border border-slate-700">
                        <span class="text-orange-400 font-semibold">${item.viTranslation || item.text}</span>
                        <span class="text-slate-400 block text-[10px] mt-0.5">${item.grammarName}</span>
                    </span>
                `;

                tag.addEventListener('mouseenter', () => updateDetailCard(item));
                tag.addEventListener('click', () => updateDetailCard(item));

                container.appendChild(tag);
            });
        }

        function updateDetailCard(item) {
            document.getElementById('cardTranslation').innerText = `"${item.text.trim()}" ➔ ${item.viTranslation || 'N/A'}`;
            document.getElementById('cardGrammarType').innerText = item.grammarName;
        }

        function formatBracketText(text) {
            return text.replace(/(\b[\w']+\b)\s*(\([\s\S]*?\))/g, '<b class="bold-before-bracket">$1</b><span class="bracket-note">$2</span>');
        }

        function filterType(type) {
            const tags = document.querySelectorAll('.phrase-tag');
            const buttons = document.querySelectorAll('.legend-btn');

            buttons.forEach(btn => btn.classList.remove('active', 'bg-slate-800', 'text-white'));
            event.currentTarget.classList.add('active', 'bg-slate-800', 'text-white');

            tags.forEach(tag => {
                if (type === 'all') {
                    tag.classList.remove('active-filter');
                    tag.style.opacity = '1';
                } else if (tag.getAttribute('data-type') === type) {
                    tag.classList.add('active-filter');
                    tag.style.opacity = '1';
                } else {
                    tag.classList.remove('active-filter');
                    tag.style.opacity = '0.25';
                }
            });
        }
    </script>
</body>
</html>
